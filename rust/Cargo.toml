[package]
name = "mini-monitor-native"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3.19.1"
time = "=0.3.41"
reqwest = { version = "=0.11.27", features = ["blocking"] }
sha2 = "=0.10.8"
ring = "=0.17.14"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
base64 = "=0.21.7"
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Communication", "Win32_Devices_Display", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Performance"] }
