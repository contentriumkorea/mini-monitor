name: Publish fixed online installer
on:
  push:
    branches: [main]
    paths: [installer/release-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mini-monitor-installer-release
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build fixed bootstrap (no application payload)
        shell: pwsh
        run: ./scripts/Build-Installer.ps1
      - name: Prepare verification runtime
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install cryptography==50.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Verification dependency installation failed' }
      - name: Verify signed acquisition and latest public metadata
        shell: pwsh
        run: ./scripts/Test-OnlineInstaller.ps1 -Live
      - name: Reject adjacent replacement signature verifier
        shell: pwsh
        run: ./scripts/Test-VerifierIsolation.ps1
      - name: Test real online installation, rollback and removal
        shell: pwsh
        run: ./scripts/Test-Installer.ps1
      - name: Publish permanent installer separately (not Latest)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $before = gh api repos/contentriumkorea/mini-monitor/releases/latest --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $before -notmatch '^v\d+\.\d+\.\d+$') { throw 'Latest must be a stable application release' }
          $request = Get-Content installer/release-request.json -Raw | ConvertFrom-Json
          if ($request.tag -ne 'installer-v1') { throw 'Unexpected installer release request' }
          gh release create installer-v1 --repo contentriumkorea/mini-monitor --target $env:GITHUB_SHA --draft --title 'Mini Monitor 온라인 설치기' --notes-file installer/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create installer draft; existing releases are never overwritten' }
          gh release upload installer-v1 build/installer/Mini-Monitor-Setup.exe --repo contentriumkorea/mini-monitor
          if ($LASTEXITCODE -ne 0) { throw 'Installer upload failed; draft retained' }
          gh release edit installer-v1 --repo contentriumkorea/mini-monitor --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Installer publication failed' }
          $after = gh api repos/contentriumkorea/mini-monitor/releases/latest --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $after -ne $before) { throw 'Application Latest changed unexpectedly' }

